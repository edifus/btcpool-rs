name: Release

# Cut a release by pushing a tag, e.g.:
#   git tag -a v0.3.0 -m "v0.3.0" && git push origin v0.3.0
# This builds Linux x86_64 and aarch64 binaries (each on a native runner),
# attaches them to a GitHub Release, and generates release notes from the
# commits since the previous tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install libzmq
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          install -Dm755 target/release/btcpool-rs dist/btcpool-rs
          install -Dm644 config.toml.example dist/config.toml.example
          install -Dm644 README.md dist/README.md
          tar -C dist -czf "btcpool-rs-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: btcpool-rs-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: btcpool-rs-*.tar.gz
          generate_release_notes: true
          body: |
            ## btcpool-rs ${{ github.ref_name }}

            ### Install

            **Docker (recommended)** — no system dependencies, multi-arch
            (amd64 + arm64):
            ```bash
            docker pull ghcr.io/edifus/btcpool-rs:${{ github.ref_name }}
            ```

            **Binary** — the attached tarballs are dynamically linked Linux
            builds (x86_64 and aarch64) and require `libzmq5` on the host
            (`apt-get install libzmq5`).
