name: E2E block acceptance

# The one test that exercises the path no unit test can: mine a real block
# through the pool and have a real bitcoind accept it onto the chain. Guards the
# bugs that are invisible until a block is actually found (prev-hash byte order,
# BIP34 height, merkle root, witness commitment, the submit path).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BITCOIN_VERSION: "28.0"

jobs:
  block-acceptance:
    name: Mine a block, require node acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install libzmq
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev pkg-config

      - name: Install Bitcoin Core (bitcoind + bitcoin-cli)
        run: |
          set -euo pipefail
          url="https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}/bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz"
          curl -fsSL "$url" -o bitcoin.tar.gz
          tar -xzf bitcoin.tar.gz
          echo "BITCOIND=$PWD/bitcoin-${BITCOIN_VERSION}/bin/bitcoind" >> "$GITHUB_ENV"
          echo "BITCOIN_CLI=$PWD/bitcoin-${BITCOIN_VERSION}/bin/bitcoin-cli" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run block-acceptance test (release)
        run: cargo test --release --test block_acceptance -- --ignored --nocapture
